spring.application.name=contactUs
server.port=${PORT:${SERVER_PORT:8083}}
server.address=0.0.0.0

#LOGGING
logging.pattern.console=${CONSOLE_LOG_PATTERN:%green(%d{HH:mm:ss.SSS}) %blue(%-5level) %red([%thread]) %yellow(%logger{15}) - %cyan(%msg%n)}

spring.config.import=optional:file:.env[.properties]

#DOCKER
spring.docker.compose.enabled=${SPRING_DOCKER_COMPOSE_ENABLED:true}
spring.docker.compose.lifecycle-management=start-and-stop
spring.docker.compose.start.command=up
spring.docker.compose.stop.command=stop

#GEMINI SERVICE
gemini.service.url=${GEMINI_SERVICE_URL}

#INTERNAL SECRET
app.internal.secret=${APP_INTERNAL_SECRET}

#PERFORMANCE & FAST BOOT (Cloud Free-Tier Optimized)
spring.main.lazy-initialization=true
spring.jmx.enabled=false

#DATABASE
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://${DATABASE_HOST}:${DATABASE_PORT}/${DATABASE_NAME}${DATABASE_PARAMS:}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=600000

#JPA HIBERNATE
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.hibernate.ddl-auto=${HIBERNATE_DDL_AUTO:update}
spring.jpa.properties.hibernate.format_sql=${HIBERNATE_FORMAT_SQL:false}
