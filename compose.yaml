services:
  postgres:
    image: postgres:15-alpine
    container_name: contact_us_db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: contactUs@sept26
      POSTGRES_DB: contact_us
    volumes:
      - //d/DockerData/contactUs:/var/lib/postgresql/data
    restart: always
